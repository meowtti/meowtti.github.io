{{- /* 글 속 링크 한 곳 — https:// 로 시작하는 주소(바깥 사이트 · 따로 올린 놀이 저장소)는 새 탭, /로 시작하는 사이트 안 주소는 그대로.
       놀이 저장소는 같은 주소(meowtti.github.io)라 「주소가 같나」로는 못 가른다(2026-11-15 첫 글에서 시험이 잡음). */ -}}
{{- $u := urls.Parse .Destination -}}
<a href="{{ .Destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $u.IsAbs }} target="_blank" rel="noopener"{{ end }}>{{ .Text }}</a>
{{- /**/ -}}
