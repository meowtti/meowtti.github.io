# 깃허브가 놀이터를 굽고 띄운다.
# 바탕: 깃허브 공식 Hugo 견본(actions/starter-workflows pages/hugo.yml · 2026-11-15)에서 필요한 줄만, 오늘 판으로.
# - 자동 작업은 태그 대신 커밋 지문(SHA)으로 고정한다(태그는 주인이 옮길 수 있다). 판을 올릴 땐 지문과 # 뒤 판 이름을 같이 바꾼다.
# - Hugo 판은 hugo.toml과 같아야 한다 · 받은 Hugo는 체크섬으로 확인한 뒤 설치한다 (tests/test_workflow.py가 맞댄다).
name: 놀이터 굽고 띄우기

on:
  push:
    branches: [main]
  workflow_dispatch:

# 기본 권한은 읽기만 — 띄우는 권한은 deploy 작업에만 준다(Hugo를 받아 굽는 build 작업엔 안 줌)
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.170.0
      HUGO_DEB_SHA256: f9708cd2eee28504a0c5b488ddb8e8b49008bd7e99862bccfa76bbe50809d3ee
    steps:
      - name: Hugo 설치 (체크섬 확인 뒤)
        run: |
          curl -fsSL -o "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_DEB_SHA256}  ${{ runner.temp }}/hugo.deb" | sha256sum -c -
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: 저장소 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pages 설정
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: 굽기 (경고도 실패)
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --panicOnWarning --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: 구운 것 올리기
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 띄우기
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
